<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>404 - Page Not Found | Subrata Kumar Bhowmik</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:1.5rem;
    }
    .wrap{max-width:560px;text-align:center}
    h1{font-size:clamp(4rem,18vw,8rem);line-height:1;letter-spacing:-0.04em;color:#38bdf8;font-weight:800}
    h2{font-size:clamp(1.25rem,4vw,1.75rem);margin:0.5rem 0 1rem;font-weight:600}
    p{color:#94a3b8;line-height:1.6;margin-bottom:1.75rem}
    a.btn{
      display:inline-block;padding:0.75rem 1.75rem;background:#38bdf8;color:#0f172a;
      text-decoration:none;border-radius:0.5rem;font-weight:600;transition:transform .15s ease,background .15s ease;
    }
    a.btn:hover{background:#7dd3fc;transform:translateY(-1px)}
    a.btn:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a class="btn" href="/">Back to Home</a>
  </main>
</body>
</html>
